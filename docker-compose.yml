version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bmis-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bmis
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bmis-backend
    restart: always
    depends_on:
      - db
    environment:
      - PORT=8080
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=bmis
      - DB_PORT=5432
      - DB_SSLMODE=disable
      - JWT_SECRET=super_secret_barangay_key_2026
      - OPENAI_API_KEY=
      - UPLOAD_DIR=/app/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bmis-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres-data:
  uploads-data:
